# Creality K2 Plus -- High-Speed quality process profile (OrcaSlicer)
#
# Generated by WorkTrackCAM (Pivot Stage 4 task: K2 Plus OrcaSlicer profiles).
# Provenance:
#   - CLAUDE.md "USER CONTEXT -- TARGET MACHINES" Sec.1 (K2 Plus envelope).
#   - src/shared/k2-plus-slice-presets.ts HIGH_SPEED_PRESET.settings -- this
#     file translates CuraEngine keys -> Orca/PrusaSlicer keys.
#   - src/shared/k2-plus-slice-presets.ts K2_PLUS_HARDWARE_CEILINGS:
#       XY <=600 mm/s (travel sits AT 600), XY accel <30000 mm/s²,
#       SCV <=9 mm/s (sits AT 9), nozzle <350 °C, bed <120 °C.
#       This preset is allowed to ride the travel + jerk ceilings;
#       all other axes stay STRICTLY UNDER.
#   - resources/orca-slicer/profiles/machines/creality-k2-plus.ini
#     (machine_max_* caps that Orca cross-checks at slice time).
#
# Intent: high-throughput PLA -- 500 mm/s print, 25000 mm/s² accel, leans
# on the K2's input-shaping headroom. 230 °C nozzle (from filament side)
# keeps up with the melt rate. Pair with a high-flow hotend if available.
# Loaded by the slice:orca IPC handler when qualityPresetId === 'high_speed'.
#
# Format: PrusaSlicer/Slic3r single-profile .ini -- flat `key = value`.

# --- Identity --------------------------------------------------------------
print_settings_id = K2 Plus High-Speed (WorkTrackCAM)
compatible_printers = Creality K2 Plus
filename_format = {input_filename_base}_{filament_type[initial_tool]}_HS_{print_time}.gcode

# --- Layer geometry --------------------------------------------------------
# layer_height 0.2 / initial 0.3 (CuraEngine layer_height_0=0.3,
# line_width=0.42 -- wider line for throughput at constant flow).
layer_height = 0.2
initial_layer_print_height = 0.3
resolution = 0.012
line_width = 0.42
inner_wall_line_width = 0.45
outer_wall_line_width = 0.42
top_surface_line_width = 0.42
sparse_infill_line_width = 0.45
internal_solid_infill_line_width = 0.42
initial_layer_line_width = 0.5
support_line_width = 0.4

# --- Walls / shells (CuraEngine wall_line_count=3, top=5, bottom=4) -------
wall_loops = 3
top_shell_layers = 5
top_shell_thickness = 1.0
bottom_shell_layers = 4
bottom_shell_thickness = 0.8
top_surface_pattern = monotonicline
bottom_surface_pattern = monotonic
only_one_wall_top = 1
precise_outer_wall = 1
detect_thin_wall = 0
detect_overhang_wall = 1
wall_infill_order = inner wall/outer wall/infill
seam_position = aligned

# --- Infill ----------------------------------------------------------------
# CuraEngine: infill_pattern=gyroid, infill_sparse_density=15.
sparse_infill_density = 15%
sparse_infill_pattern = gyroid
infill_direction = 45
infill_wall_overlap = 25%
infill_combination = 0
minimum_sparse_infill_area = 15
internal_bridge_support_thickness = 0.8

# --- Speeds (mm/s) -- travel AT 600 K2 XY ceiling -------------------------
# CuraEngine map:
#   speed_print=500       -> outer/inner reference + sparse_infill_speed
#   speed_wall_0=350      -> outer_wall_speed
#   speed_wall_x=450      -> inner_wall_speed
#   speed_topbottom=300   -> top_surface_speed
#   speed_infill=600      -> sparse_infill_speed (AT travel ceiling)
#   speed_travel=600      -> travel_speed       (AT K2 XY ceiling)
#   speed_layer_0=80      -> initial_layer_speed
outer_wall_speed = 350
inner_wall_speed = 450
sparse_infill_speed = 500
internal_solid_infill_speed = 400
top_surface_speed = 300
gap_infill_speed = 300
initial_layer_speed = 80
initial_layer_infill_speed = 120
travel_speed = 600
bridge_speed = 80
internal_bridge_speed = 150%
support_speed = 200
support_interface_speed = 100
overhang_1_4_speed = 0
overhang_2_4_speed = 80
overhang_3_4_speed = 50
overhang_4_4_speed = 15

# --- Accelerations (mm/s²) -- travel AT 30000 K2 XY ceiling ---------------
# CuraEngine map:
#   acceleration_print=25000     -> default_acceleration
#   acceleration_travel=30000    -> travel_acceleration (AT ceiling)
#   acceleration_wall_0=15000    -> outer_wall_acceleration
#   acceleration_topbottom=12000 -> top_surface_acceleration
#   acceleration_layer_0=3000    -> initial_layer_acceleration
default_acceleration = 25000
travel_acceleration = 30000
outer_wall_acceleration = 15000
inner_wall_acceleration = 25000
top_surface_acceleration = 12000
initial_layer_acceleration = 3000

# --- Jerk (Klipper SCV, mm/s) -- AT 9 K2 ceiling for print/travel --------
# CuraEngine jerk_* map: print=9, travel=9, wall_0=8, layer_0=6.
default_jerk = 9
travel_jerk = 9
outer_wall_jerk = 8
inner_wall_jerk = 8
top_surface_jerk = 7
initial_layer_jerk = 6
infill_jerk = 9

# --- Adhesion (CuraEngine adhesion_type=skirt, skirt_line_count=2) --------
skirt_loops = 2
skirt_distance = 4
skirt_height = 1
brim_width = 0
brim_object_gap = 0.1
raft_layers = 0
elefant_foot_compensation = 0.15

# --- Support (off; can be flipped per-job) --------------------------------
enable_support = 0
support_type = normal(auto)
support_style = default
support_on_build_plate_only = 0
support_top_z_distance = 0.2
support_bottom_z_distance = 0.2
support_base_pattern = default
support_base_pattern_spacing = 2.5
support_interface_top_layers = 2
support_interface_bottom_layers = 2
support_interface_spacing = 0.5
support_threshold_angle = 30
support_object_xy_distance = 0.35
tree_support_branch_diameter = 2
tree_support_branch_angle = 45
tree_support_wall_count = 1

# --- Misc quality knobs ---------------------------------------------------
reduce_infill_retraction = 1
xy_hole_compensation = 0
xy_contour_compensation = 0
enable_prime_tower = 0
wipe_tower_no_sparse_layers = 0
prime_tower_width = 40
ironing_type = no ironing
ironing_flow = 10%
ironing_spacing = 0.15
ironing_speed = 30
interface_shells = 0
standby_temperature_delta = -5
gcode_label_objects = 0
