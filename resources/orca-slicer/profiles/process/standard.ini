# Creality K2 Plus -- Standard quality process profile (OrcaSlicer)
#
# Generated by WorkTrackCAM (Pivot Stage 4 task: K2 Plus OrcaSlicer profiles).
# Provenance:
#   - CLAUDE.md "USER CONTEXT -- TARGET MACHINES" Sec.1 (K2 Plus envelope).
#   - src/shared/k2-plus-slice-presets.ts STANDARD_PRESET.settings -- this
#     file translates CuraEngine keys -> Orca/PrusaSlicer keys.
#   - src/shared/k2-plus-slice-presets.ts K2_PLUS_HARDWARE_CEILINGS:
#       XY <600 mm/s, XY accel <30000 mm/s², SCV <9 mm/s,
#       nozzle <350 °C, bed <120 °C. STRICTLY under, not at, for Standard.
#   - resources/orca-slicer/profiles/machines/creality-k2-plus.ini
#     (machine_max_* caps that Orca cross-checks at slice time).
#
# Intent: safe daily-driver. 0.2 mm layers, 200 mm/s print, 5000 mm/s²
# accel, SCV 8 mm/s. Good surface quality on PLA / PETG / ABS / ASA.
# Loaded by the slice:orca IPC handler when qualityPresetId === 'standard'.
#
# Format: PrusaSlicer/Slic3r single-profile .ini -- flat `key = value`.

# --- Identity --------------------------------------------------------------
print_settings_id = K2 Plus Standard (WorkTrackCAM)
compatible_printers = Creality K2 Plus
filename_format = {input_filename_base}_{filament_type[initial_tool]}_{print_time}.gcode

# --- Layer geometry --------------------------------------------------------
# layer_height 0.2 / initial 0.28 (CuraEngine layer_height_0=0.28).
layer_height = 0.2
initial_layer_print_height = 0.28
resolution = 0.012
line_width = 0.4
inner_wall_line_width = 0.45
outer_wall_line_width = 0.4
top_surface_line_width = 0.4
sparse_infill_line_width = 0.4
internal_solid_infill_line_width = 0.4
initial_layer_line_width = 0.45
support_line_width = 0.4

# --- Walls / shells (CuraEngine wall_line_count=3, top=5, bottom=4) -------
wall_loops = 3
top_shell_layers = 5
top_shell_thickness = 1.0
bottom_shell_layers = 4
bottom_shell_thickness = 0.8
top_surface_pattern = monotonicline
bottom_surface_pattern = monotonic
only_one_wall_top = 1
precise_outer_wall = 1
detect_thin_wall = 0
detect_overhang_wall = 1
wall_infill_order = inner wall/outer wall/infill
seam_position = aligned

# --- Infill ----------------------------------------------------------------
# CuraEngine: infill_pattern=grid, infill_sparse_density=20.
sparse_infill_density = 20%
sparse_infill_pattern = grid
infill_direction = 45
infill_wall_overlap = 30%
infill_combination = 0
minimum_sparse_infill_area = 15
internal_bridge_support_thickness = 0.8

# --- Speeds (mm/s) -- ALL UNDER 600 K2 XY ceiling -------------------------
# CuraEngine map:
#   speed_print=200       -> sparse_infill_speed (and overall reference)
#   speed_wall_0=150      -> outer_wall_speed
#   speed_wall_x=180      -> inner_wall_speed
#   speed_topbottom=150   -> top_surface_speed
#   speed_infill=250      -> sparse_infill_speed
#   speed_travel=300      -> travel_speed
#   speed_layer_0=60      -> initial_layer_speed
outer_wall_speed = 150
inner_wall_speed = 180
sparse_infill_speed = 250
internal_solid_infill_speed = 200
top_surface_speed = 150
gap_infill_speed = 200
initial_layer_speed = 60
initial_layer_infill_speed = 100
travel_speed = 300
bridge_speed = 50
internal_bridge_speed = 150%
support_speed = 150
support_interface_speed = 80
overhang_1_4_speed = 0
overhang_2_4_speed = 50
overhang_3_4_speed = 30
overhang_4_4_speed = 10

# --- Accelerations (mm/s²) -- ALL UNDER 30000 K2 XY ceiling ---------------
# CuraEngine map:
#   acceleration_print=5000     -> default_acceleration
#   acceleration_travel=8000    -> travel_acceleration
#   acceleration_wall_0=4000    -> outer_wall_acceleration
#   acceleration_topbottom=4000 -> top_surface_acceleration
#   acceleration_layer_0=1500   -> initial_layer_acceleration
default_acceleration = 5000
travel_acceleration = 8000
outer_wall_acceleration = 4000
inner_wall_acceleration = 5000
top_surface_acceleration = 4000
initial_layer_acceleration = 1500

# --- Jerk (Klipper square_corner_velocity, mm/s) -- UNDER 9 K2 ceiling ----
# CuraEngine jerk_* map directly to Orca's *_jerk fields. SCV cap = 9; we
# sit at 8 for headroom on first layer + walls.
default_jerk = 8
travel_jerk = 8
outer_wall_jerk = 6
inner_wall_jerk = 6
top_surface_jerk = 6
initial_layer_jerk = 4
infill_jerk = 8

# --- Adhesion (CuraEngine adhesion_type=skirt, skirt_line_count=2) --------
skirt_loops = 2
skirt_distance = 4
skirt_height = 1
brim_width = 0
brim_object_gap = 0.1
raft_layers = 0
elefant_foot_compensation = 0.15

# --- Support (off; can be flipped per-job) --------------------------------
enable_support = 0
support_type = normal(auto)
support_style = default
support_on_build_plate_only = 0
support_top_z_distance = 0.2
support_bottom_z_distance = 0.2
support_base_pattern = default
support_base_pattern_spacing = 2.5
support_interface_top_layers = 2
support_interface_bottom_layers = 2
support_interface_spacing = 0.5
support_threshold_angle = 30
support_object_xy_distance = 0.35
tree_support_branch_diameter = 2
tree_support_branch_angle = 45
tree_support_wall_count = 1

# --- Misc quality knobs ---------------------------------------------------
reduce_infill_retraction = 1
xy_hole_compensation = 0
xy_contour_compensation = 0
enable_prime_tower = 0
wipe_tower_no_sparse_layers = 0
prime_tower_width = 40
ironing_type = no ironing
ironing_flow = 10%
ironing_spacing = 0.15
ironing_speed = 30
interface_shells = 0
standby_temperature_delta = -5
gcode_label_objects = 0
