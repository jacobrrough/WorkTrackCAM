# Creality K2 Plus -- OrcaSlicer machine profile
#
# Generated by WorkTrackCAM (Pivot Stage 4 task: K2 Plus OrcaSlicer profiles).
# Provenance:
#   - CLAUDE.md "USER CONTEXT -- TARGET MACHINES" Sec.1 (K2 Plus hardware spec).
#   - src/shared/k2-plus-slice-presets.ts K2_PLUS_HARDWARE_CEILINGS -- the
#     upper bound for every speed/accel/temp value below. Nothing in this
#     file may exceed those ceilings.
#   - resources/machines/creality-k2-plus.json (WorkTrackCAM machine row).
#   - OrcaSlicer canonical reference:
#     SoftFever/OrcaSlicer @ resources/profiles/Creality/machine/
#     "Creality K2 Plus 0.4 nozzle.json" (key names cribbed from upstream).
#
# Format: PrusaSlicer/Slic3r single-profile .ini -- flat `key = value` lines,
# no [section] headers. Loaded via `orca-slicer --load <this file>`.
# Multi-value settings (printable_area, machine_max_*) use the upstream
# convention shown by the Orca JSON profile.
#
# Safety Rule 1 (G-code is sacred): the `machine_max_*` ceilings below cap
# the *machine's* envelope. Per-profile process speeds/accels stay STRICTLY
# UNDER these in process/{standard,high_speed}.ini.

# --- Identity --------------------------------------------------------------
printer_model = Creality K2 Plus
printer_variant = 0.4
printer_settings_id = Creality K2 Plus (WorkTrackCAM)
printer_technology = FFF
gcode_flavor = klipper
thumbnails_format = PNG
thumbnails = 300x300,96x96

# --- Build volume + bed ----------------------------------------------------
# 350 x 350 x 350 mm CoreXY -- CLAUDE.md Sec.1.
printable_area = 0x0,350x0,350x350,0x350
printable_height = 350
bed_exclude_area =
support_air_filtration = 1
support_chamber_temp_control = 1
support_multi_bed_types = 1

# --- Hot end + extruder ----------------------------------------------------
# 1.75 mm filament, 0.4 mm hardened-steel nozzle, dual-gear direct drive.
nozzle_diameter = 0.4
nozzle_type = hardened_steel
nozzle_volume = 183
single_extruder_multi_material = 1
manual_filament_change = 0
extruder_clearance_height_to_lid = 118
extruder_clearance_height_to_rod = 24
extruder_clearance_radius = 64
max_layer_height = 0.3
min_layer_height = 0.08

# --- Machine motion ceilings ----------------------------------------------
# Match K2_PLUS_HARDWARE_CEILINGS (XY 600 mm/s, XY accel 30000 mm/s²,
# Z 30 mm/s, Z accel 500 mm/s², E 100 mm/s, E accel 5000 mm/s²,
# Klipper SCV / jerk 9 mm/s, nozzle 350 °C, bed 120 °C).
# Two-value arrays = [normal, silent] modes (Orca/PrusaSlicer convention).
machine_max_speed_x = 600,600
machine_max_speed_y = 600,600
machine_max_speed_z = 30,30
machine_max_speed_e = 100,100
machine_max_acceleration_x = 30000,30000
machine_max_acceleration_y = 30000,30000
machine_max_acceleration_z = 500,500
machine_max_acceleration_e = 5000,5000
machine_max_acceleration_extruding = 30000,30000
machine_max_acceleration_retracting = 5000,5000
machine_max_acceleration_travel = 30000,30000
machine_max_jerk_x = 9,9
machine_max_jerk_y = 9,9
machine_max_jerk_z = 5,5
machine_max_jerk_e = 10,10
# Klipper square_corner_velocity surfaces as XY jerk above; mirror here
# so renderers/sanity-checkers that read this key explicitly find it.
machine_min_extruding_rate = 0,0
machine_min_travel_rate = 0,0

# --- Retraction (direct-drive K2 -- short distance) ------------------------
retraction_length = 0.8
retraction_speed = 40
deretraction_speed = 40
retraction_minimum_travel = 1
retract_before_wipe = 70%
retract_length_toolchange = 0
retract_lift_above = 0
retract_lift_below = 349
z_hop = 0.4
wipe_distance = 2

# --- Multimaterial / CFS (capability hints, off by default in single-mat) --
enable_filament_ramming = 0
purge_in_prime_tower = 0
cooling_tube_length = 0
cooling_tube_retraction = 0
parking_pos_retraction = 0
extra_loading_move = 0

# --- Default child profiles (informational) --------------------------------
default_print_profile = standard
default_filament_profile = pla-generic

# --- Klipper macros & Moonraker auto-leveling start gcode -----------------
# Uses Klipper macros (START_PRINT / END_PRINT) that ship with the K2 Plus
# Creality Klipper image. Adaptive probing is enabled by writing the print
# area MIN/MAX coordinates as Klipper-side annotations (lines 1-4) before
# the macro invocation. T0 selects the active extruder. Initial purge line
# is short (30 mm² total) for direct-drive priming. Stays below the 12 m/s
# (12000 mm/min) feed used during priming -- well inside the K2 envelope.
machine_start_gcode = ";SET PRINT AREA MIN AND MAX COORDINATES TO ENABLE ADAPTIVE PROBING\n; MINX = {first_layer_print_min[0]}\n; MINY = {first_layer_print_min[1]}\n; MAXX = {first_layer_print_max[0]}\n; MAXY = {first_layer_print_max[1]}\nM140 S0\nM104 S0\nSTART_PRINT EXTRUDER_TEMP=[nozzle_temperature_initial_layer] BED_TEMP=[bed_temperature_initial_layer_single] CHAMBER_TEMP=[chamber_temperature]\nT[initial_no_support_extruder]\nM109 S[nozzle_temperature_initial_layer]\nM204 S2000\nG1 Z3 F600\nM83\nG1 Y150 F12000\nG1 X0 F12000\nG1 Z0.2 F600\nG1 X0 Y150 F6000\nG1 X0 Y0 E15 F6000\nG1 X150 Y0 E15 F6000\nG92 E0\nG1 Z1 F600
machine_end_gcode = END_PRINT
machine_pause_gcode = PAUSE
before_layer_change_gcode = ;BEFORE_LAYER_CHANGE\n;[layer_z]\nG92 E0\n
change_filament_gcode = G2 Z{z_after_toolchange + 0.4} I0.86 J0.86 P1 F10000 ; spiral lift\nG1 X0 Y245 F30000\nG1 Z{z_after_toolchange} F600

# --- Misc K2-friendly defaults --------------------------------------------
scan_first_layer = 0
auxiliary_fan = 1
