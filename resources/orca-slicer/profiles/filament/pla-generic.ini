# Generic PLA -- OrcaSlicer filament profile for the Creality K2 Plus
#
# Generated by WorkTrackCAM (Pivot Stage 4 task: K2 Plus OrcaSlicer profiles).
# Provenance:
#   - CLAUDE.md "USER CONTEXT -- TARGET MACHINES" Sec.1 (K2 Plus envelope:
#     nozzle <=350 °C, bed <=120 °C, chamber heater present).
#   - src/shared/k2-plus-slice-presets.ts STANDARD_PRESET temperatures:
#     material_print_temperature=215 / layer_0=220, bed=60 / layer_0=65,
#     build_volume_temperature=35, retraction 0.5 mm @ 40 mm/s.
#     (HIGH_SPEED_PRESET bumps print to 230 °C and chamber to 40 °C; both
#     remain strictly under the K2_PLUS_HARDWARE_CEILINGS.)
#   - resources/orca-slicer/profiles/machines/creality-k2-plus.ini
#     (machine_max_* caps that constrain retraction_speed).
#
# Intent: safe generic PLA aligned with the K2 Plus daily-driver. Standard
# 1.75 mm filament. Stays well clear of every K2 hardware ceiling so it
# can pair with either the Standard or High-Speed process profile without
# producing G-code that would crash the printer.
#
# Format: PrusaSlicer/Slic3r single-profile .ini -- flat `key = value`.

# --- Identity --------------------------------------------------------------
filament_settings_id = Generic PLA (WorkTrackCAM)
filament_vendor = Generic
filament_type = PLA
compatible_printers = Creality K2 Plus
filament_diameter = 1.75
filament_flow_ratio = 1.0
filament_is_support = 0

# --- Physical material properties -----------------------------------------
# Density 1.24 g/cm³ -- PLA industry baseline (Polymaker / eSun datasheets).
filament_density = 1.24
filament_cost = 20.0
filament_minimal_purge_on_wipe_tower = 15

# --- Temperatures (°C) -- ALL UNDER K2_PLUS_HARDWARE_CEILINGS -------------
# Nozzle ceiling 350 °C: PLA prints at 215 (layer 0: 220). Well clear.
# Bed ceiling 120 °C: PLA bed 60 (layer 0: 65). Well clear.
# Chamber present: 35 °C keeps PLA from softening.
nozzle_temperature = 215
nozzle_temperature_initial_layer = 220
nozzle_temperature_range_low = 190
nozzle_temperature_range_high = 240
hot_plate_temp = 60
hot_plate_temp_initial_layer = 65
cool_plate_temp = 60
cool_plate_temp_initial_layer = 65
textured_plate_temp = 60
textured_plate_temp_initial_layer = 65
eng_plate_temp = 60
eng_plate_temp_initial_layer = 65
chamber_temperature = 35
chamber_temperatures = 35

# --- Cooling --------------------------------------------------------------
# 100 % part-cooling fan from layer 2 (close_fan_the_first_x_layers=1).
# Layer-time aware slow-down keeps small layers cool enough.
fan_always_on = 1
fan_min_speed = 100
fan_max_speed = 100
overhang_fan_threshold = 50%
overhang_fan_speed = 100
close_fan_the_first_x_layers = 1
slow_down_layer_time = 7
slow_down_min_speed = 20
full_fan_speed_layer = 2
reduce_fan_stop_start_freq = 1
support_material_interface_fan_speed = -1
additional_cooling_fan_speed = 100

# --- Retraction overrides (direct-drive K2 -- short distance) -------------
# CuraEngine: retraction_amount=0.5 mm, retraction_speed=40 mm/s.
# (Machine ini's retraction_length=0.8 is the cross-filament default; this
#  filament profile overrides it for PLA-on-K2-direct-drive.)
filament_retraction_length = 0.5
filament_retraction_speed = 40
filament_deretraction_speed = 40
filament_retraction_minimum_travel = 1
filament_z_hop = 0.0
filament_retraction_when_switch_layer = 0
filament_wipe = 0

# --- Pressure advance / linear advance (Klipper) --------------------------
# 0.04 is a safe baseline for PLA on direct-drive K2 hotends. Users should
# run a PA tower per spool; this is a sensible default until they do.
pressure_advance = 0.04
pressure_advance_smoothing = 0.04

# --- Misc material knobs --------------------------------------------------
filament_max_volumetric_speed = 18
filament_load_time = 0
filament_unload_time = 0
filament_start_gcode =
filament_end_gcode =
filament_soluble = 0
temperature_vitrification = 50
